<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TokenConsumption</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">💸 TokenConsumption</div>
    <nav>
      <a href="/" class="{{ 'active' if page=='overview' else '' }}">Overview</a>
      <a href="/trends" class="{{ 'active' if page=='trends' else '' }}">Trends</a>
      <a href="/projects" class="{{ 'active' if page=='projects' else '' }}">Projects</a>
      <a href="/sessions" class="{{ 'active' if page=='sessions' else '' }}">Sessions</a>
      <a href="/logs" class="{{ 'active' if page=='logs' else '' }}">Raw logs</a>
      <a href="/account" class="{{ 'active' if page.startswith('account') else '' }}">Account Data</a>
      <a href="/settings" class="{{ 'active' if page=='settings' else '' }}">Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer><code>{{ budget_line }}</code></footer>
</body>
</html>
